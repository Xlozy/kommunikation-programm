<style>
/* Kommunikation v2 – eine Datei, kein Build. Palette und Typografie wie «Feld» (D-017). */
:root{
  --bg:#1c1f23; --side:#15171a; --kartei:#22262b; --line:#2c3036; --line2:#343940; --line3:#454c57;
  --text:#e8e9eb; --text2:#c3c8ce; --muted:#9aa0a8; --faint:#6f7680;
  --accent:#8db4ff; --accent-hi:#b3ccff; --accent-ink:#0f1726; --warn:#f5b84a;
  --hover:#262b33; --field:#1f2327; --on:#2a3038;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
@media (min-width:901px){body{overflow:hidden}}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 "Public Sans",-apple-system,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}a:hover{color:var(--accent-hi)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Kopf */
.top{height:52px;display:flex;align-items:center;gap:18px;padding:0 16px;background:var(--side);border-bottom:1px solid var(--line)}
.top .marke{font-size:18px;font-weight:700;letter-spacing:-.01em}
.top nav{display:flex;gap:4px}
.tab{background:none;border:0;color:var(--text2);font-size:14px;font-weight:500;padding:6px 12px;border-radius:7px;cursor:pointer}
.tab[aria-pressed=true]{background:var(--on);color:var(--text);font-weight:600}
.navh{display:flex;gap:2px;margin-left:auto}
.navh .icon[aria-disabled=true]{opacity:.35;cursor:default}
.navh .icon[aria-disabled=true]:hover{color:var(--muted)}
.such{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;width:280px}
.such input{background:none;border:0;outline:none;font-size:14px;flex:1;min-width:0}
.such kbd{font:inherit;font-size:12px;color:var(--muted);border:1px solid var(--line2);border-radius:4px;padding:1px 5px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.icon{background:none;border:0;padding:6px;cursor:pointer;display:flex;color:var(--muted);border-radius:6px}
.icon:hover{color:var(--text)}

/* Zwei Spalten */
.app{display:flex;height:calc(100% - 52px)}
#side,#main{position:relative}
#side{width:400px;flex:none;border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column}
#main{flex:1;min-width:0;background:var(--kartei);overflow:auto}
.shead{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:2}
.shead h2{margin:0;font-size:17px;font-weight:700}
.shead .n{font-size:14px;color:var(--muted)}
.shead .sp{flex:1}
.tsel{background:none;border:0;font-size:12px;color:var(--muted);cursor:pointer;padding:4px 2px}
.tsel option{background:var(--kartei);color:var(--text)}
.plus{width:32px;height:32px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:600;cursor:pointer;flex:none}
.sub{background:none;border:0;padding:4px 8px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer}
.sub[aria-pressed=true]{background:var(--on);color:var(--text);font-weight:600}
.gruppe{font-size:12px;font-weight:700;color:var(--muted);padding:14px 18px 6px;border-bottom:1px solid var(--line);margin:0}
ul.liste{list-style:none;margin:0;padding:0}
.eintrag{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:10px 18px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.eintrag:hover{background:var(--kartei)}
.eintrag[aria-current=true]{background:var(--hover);box-shadow:inset 3px 0 0 var(--accent)}
.eintrag .t{font-size:15px;font-weight:700;overflow-wrap:anywhere}
.eintrag .w{font-size:13px;color:var(--text2);overflow-wrap:anywhere}
.verg{margin-top:auto;background:none;border:0;border-top:1px solid var(--line);text-align:left;padding:12px 18px;font-size:13px;color:var(--muted);cursor:pointer;width:100%}
.verg:hover{color:var(--text)}
.leer{padding:18px;color:var(--muted);font-size:14px}

/* Kartei */
.kartei>*{min-width:0}
.kartei{padding:16px 28px 48px;display:flex;flex-direction:column;gap:16px;max-width:1240px}
.kopf{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sek{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.links{display:flex;gap:14px;font-size:13px;flex-wrap:wrap}
.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-size:13px;text-align:left}
.lnk:hover{color:var(--accent-hi)}
.lnk.m{color:var(--muted)}.lnk.m:hover{color:var(--text)}
.lnk.warn{color:var(--warn)}
.lnk.stark{font-weight:600}
.mehr{background:none;border:0;padding:4px 0 0;font-size:12px;color:var(--muted);cursor:pointer;text-align:left;align-self:flex-start}
.mehr:hover{color:var(--text)}
.k{font-size:12px;color:var(--muted)}

/* direkt bearbeitbare Felder */
.ed{background:transparent;border:1px solid transparent;border-radius:5px;padding:2px 5px;margin:0 -6px;min-width:0;width:calc(100% + 12px)}
.ed:hover{border-color:var(--line2)}
.ed:focus{border-color:var(--line3);background:var(--field);outline:none}
.ed:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.ed::placeholder{color:var(--faint)}
input[type=date].ed{color-scheme:dark}
input.h1{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
input.untert{font-size:14px;color:var(--text2)}
.titel{display:flex;flex-direction:column;gap:2px}

.kern{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.kc{display:flex;flex-direction:column;gap:6px;padding:12px 14px 12px 0;margin-right:14px;border-right:1px solid var(--line);min-width:0}
.kc:last-child{border-right:0;margin-right:0}
.kch{display:flex;justify-content:space-between;align-items:center}

"use strict";
/* ================= Konstanten und Hilfen ================= */
const TYPEN=["Agenda & Newsletter","Medien","Persönliche Einladung","Soziale Netzwerke","Vor Ort","Website"]; // D-003, alphabetisch (Notiz 18.10.)
const FORMEN={email:"E-Mail",formular:"Formular",post:"Post",vor_ort:"Vor Ort"};

const STD_FELDER=["Form","Dauer","Kosten","Wetter","Anmeldung","Für wen"];
const MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const MONK=["Jan","Feb","März","Apr","Mai","Juni","Juli","Aug","Sep","Okt","Nov","Dez"];
const WT=["So","Mo","Di","Mi","Do","Fr","Sa"];
const KEY_DATA="komm-v2-data", KEY_UI="komm-v2-ui";
const COPYICON='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nowISO=()=>new Date().toISOString();
const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>isoOf(new Date());
function parse(iso){const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(iso,n){const d=parse(iso);d.setDate(d.getDate()+n);return isoOf(d)}
const fmtKurz=iso=>{if(!iso)return"";const d=parse(iso);return `${WT[d.getDay()]} ${d.getDate()}. ${MONK[d.getMonth()]}`};

const fmtTag=iso=>{if(!iso)return"";const d=parse(iso);return `${d.getDate()}. ${MONK[d.getMonth()]}`};

/* ================= Ableitungen ================= */
const auftakt=p=>(p.termine&&p.termine[0]&&p.termine[0].datum)||"";
const ende=p=>(p.termine||[]).map(t=>t.datum).filter(Boolean).sort().pop()||"";
const feld=(p,k)=>((p.felder||[]).find(f=>norm(f.k)===norm(k))||{}).v||"";
function kmsFor(tid){const out=[];for(const k of live("kanaele"))if((k.traeger_ids||[]).includes(tid))for(const m of k.massnahmen||[])out.push({key:k.id+":"+m.id,k,m});return out}
function kmByKey(key){const[kid,mid]=key.split(":");const k=get("kanaele",kid);const m=k&&(k.massnahmen||[]).find(x=>x.id===mid);return m?{key,k,m}:null}
function bisDatum(p,m){const a=auftakt(p);if(!a)return"";return m.vorlauf_tage==null?a:addDays(a,-m.vorlauf_tage)}
function statusOf(p,key){return live("status").find(s=>s.projekt_id===p.id&&s.kanal_id+":"+s.massnahme_id===key)}
function presetKeys(p){const s=new Set();for(const id of p.presets||[]){const pr=get("presets",id);if(pr)pr.kanal_massnahmen.forEach(x=>s.add(x))}return s}
/* Liste = aktive Presets ∪ angefasste Massnahmen (D-023, Regel 2; P-003).
   Angefasst = von Hand hinzugefügt, Status ≠ offen oder gespeicherte Bearbeitung (versand, checkliste, postings). */
function angefasst(st){
  if(!st)return false;
  if(st.manuell||st.status!=="offen"||st.postings||st.vorlage_wahl)return true;
  if(st.versand&&Object.values(st.versand).some(v=>v!=null))return true;
  return !!(st.checkliste&&Object.keys(st.checkliste).length);
}
function rowsFor(p){
  const inP=presetKeys(p),out=[],seen=new Set();
  const push=km=>{if(seen.has(km.key))return;seen.add(km.key);const st=statusOf(p,km.key);out.push({...km,st,bis:bisDatum(p,km.m),preset:inP.has(km.key)})};
  for(const km of kmsFor(p.traeger_id)){const st=statusOf(p,km.key);if(inP.has(km.key)||angefasst(st))push(km)}
  for(const st of live("status"))if(st.projekt_id===p.id&&angefasst(st)){const km=kmByKey(st.kanal_id+":"+st.massnahme_id);if(km)push(km)}
  return out;
}
function rowOf(p,key){const km=kmByKey(key);if(!km)return null;return{...km,st:statusOf(p,key),bis:bisDatum(p,km.m),preset:presetKeys(p).has(key)}}
const sOf=r=>(r.st&&r.st.status)||"offen";
const ueber=r=>sOf(r)==="offen"&&r.bis&&r.bis<today();
function ensureStatus(p,key){let st=statusOf(p,key);if(!st){const[kid,mid]=key.split(":");st=add("status",{projekt_id:p.id,kanal_id:kid,massnahme_id:mid,status:"offen",erledigt_am:null,manuell:false})}return st}
const emails=k=>(k.kontakte||[]).map(c=>c.email).filter(Boolean);

const PH_HILFE=`Aus der Projekt-Kartei: {Titel} {Untertitel} {Datum} {Datum kurz} {Zeit} {Ort} {Treffpunkt} {Mitwirkende} {Kurzbeschreibung} {Lange Beschreibung} {Kurzbios} · jedes Feld aus «Weitere Angaben», z. B. {Form} {Dauer} {Kosten} {Wetter} {Anmeldung} · vom Träger: {Träger} {Träger-Beschreibung} {Absender} {Absender-Vorname} {Absender-E-Mail}. Eine Zeile, deren Platzhalter alle leer sind, fällt weg. Unbekannte Platzhalter wie {Name} bleiben als Lücke stehen.`;
/* Vorlage einer Kanal-Massnahme: geteilte Vorlage (D-027) oder eigener Text */
/* Mehrere Vorlagen pro Kanal-Massnahme (P-018); gewählt wird im Projekt, Standard = erste */
const vIds=m=>(m.vorlage_ids||(m.vorlage_id?[m.vorlage_id]:[])).filter(id=>get("vorlagen",id));
function setVIds(m,ids){m.vorlage_ids=ids;delete m.vorlage_id}
function tplOf(m,st){
  const ids=vIds(m),id=st&&st.vorlage_wahl&&ids.includes(st.vorlage_wahl)?st.vorlage_wahl:ids[0],v=id&&get("vorlagen",id);
  return v?{name:v.name||"",betreff:v.betreff||"",text:v.text||"",geteilt:v}:Object.assign({name:"",betreff:"",text:""},m.vorlage,{geteilt:null});
}
const tplName=m=>{const ids=vIds(m);if(ids.length)return ids.map(id=>get("vorlagen",id).name||"ohne Namen").join(" · ");const t=m.vorlage||{};return t.text||t.betreff?"eigener Text":""};
/* Platzhalter aus der Projekt-Kartei */
function werte(p){
  const t=p.termine||[],z=p.zeiten||[],o=p.orte||[],mw=(p.mitwirkende||[]).filter(x=>x.name);
  const tr=get("traeger",p.traeger_id)||{};
  const m={Titel:p.titel||"",Untertitel:p.untertitel||"",Datum:t[0]&&t[0].datum?fmtLang(t[0].datum):"",
    Zeit:(z[0]&&z[0].wert)||"",Ort:(o[0]&&o[0].wert)||"",Mitwirkende:liste(mw.map(x=>x.name)),
    Kurzbeschreibung:p.kurz||"","Lange Beschreibung":p.lang||"",Kurzbios:biosText(p),
    Absender:tr.absender_name||"","Absender-E-Mail":tr.absender_email||"",Träger:tr.name||"","Träger-Beschreibung":tr.beschreibung||"","Absender-Vorname":tr.absender_vorname||(tr.absender_name||"").trim().split(/\s+/)[0]||"",
    "Datum kurz":t[0]&&t[0].datum?`${parse(t[0].datum).getDate()}. ${MON[parse(t[0].datum).getMonth()]}`:"",
    Treffpunkt:(o.find(x=>/treffpunkt/i.test(x.zusatz||""))||{}).wert||""};
  for(const f of p.felder||[])if(f.k)m[f.k]=f.v||"";
  return m;
}
/* P-015: Eine Zeile, deren (bekannte) Platzhalter alle leer sind, fällt weg; unbekannte bleiben als Lücke stehen */
function fill(s,p,extra){
  const m=Object.assign(werte(p),extra||{});
  const z=String(s||"").split("\n").flatMap(zeile=>{let bek=0,voll=0,unbek=0;
    const r=zeile.replace(/\{([^{}]+)\}/g,(a,k)=>{if(!(k in m)){unbek++;return a}bek++;const v=String(m[k]??"");if(v.trim())voll++;return v});
    return bek&&!voll&&!unbek?[]:[r]});
  return z.join("\n").replace(/\n{3,}/g,"\n\n");
}
function biosText(p){return(p.mitwirkende||[]).filter(x=>x.name&&x.bio).map(x=>`${x.name} – ${x.bio}`).join("\n\n")}
function versand(p,r){
  const v=(r.st&&r.st.versand)||{},tpl=tplOf(r.m,r.st);
  return{betreff:v.betreff!=null?v.betreff:fill(tpl.betreff,p),text:v.text!=null?v.text:fill(tpl.text,p),
    anhaenge:v.anhaenge!=null?v.anhaenge:(p.material||[]).slice(0,1).map(x=>x.name).filter(Boolean)};
}
function formFelder(p,r){const vt=fill(tplOf(r.m,r.st).text,p);return(r.m.formular_felder||[]).map(f=>({label:f.label,limit:f.limit,wert:fill(f.wert,p,{Vorlage:vt})}))}
function kernText(p,f){
  const L={termine:x=>x.datum?fmtLang(x.datum)+(x.zusatz?` (${x.zusatz})`:""):"",zeiten:x=>x.wert?x.wert+(x.zusatz?` (${x.zusatz})`:""):"",
    orte:x=>x.wert?x.wert+(x.zusatz?` (${x.zusatz})`:""):"",mitwirkende:x=>x.name?x.name+(x.rolle?` (${x.rolle})`:""):""};
  return(p[f]||[]).map(L[f]).filter(Boolean).join("\n");
}
function alleInfos(p){
  const z=[p.titel,p.untertitel,""];
  z.push("Datum: "+kernText(p,"termine").replace(/\n/g,"; "),"Zeit: "+kernText(p,"zeiten").replace(/\n/g,"; "),
    "Ort: "+kernText(p,"orte").replace(/\n/g,"; "),"Mitwirkende: "+kernText(p,"mitwirkende").replace(/\n/g,"; "));
  for(const f of p.felder||[])if(f.k&&f.v)z.push(`${f.k}: ${f.v}`);
  if(p.kurz)z.push("","Kurzbeschreibung",p.kurz);
  if(p.lang)z.push("","Lange Beschreibung",p.lang);
  const b=biosText(p);if(b)z.push("","Kurzbios",b);
  return z.join("\n").replace(/\n{3,}/g,"\n\n").trim();
}

function focusKey(el){
  if(!el||el===document.body)return null;
  if(el.dataset.bind)return `[data-bind="${CSS.escape(el.dataset.bind)}"]`;
  if(el.id)return "#"+CSS.escape(el.id);
  const a=el.dataset.act||el.dataset.chg;if(!a)return null;
  const attr=el.dataset.act?"data-act":"data-chg";
  return `[${attr}="${CSS.escape(a)}"]`+(el.dataset.arg!=null?`[data-arg="${CSS.escape(el.dataset.arg)}"]`:"");
}

  const k=fokus||focusKey(document.activeElement);

  if(k){const n=document.querySelector(k);if(n&&n!==document.activeElement)n.focus({preventScroll:true})}
}

/* ---- Seitenliste ---- */
function wann(p){
  const a=auftakt(p),z=((p.zeiten||[])[0]||{}).wert||"",o=((p.orte||[])[0]||{}).wert||"";
  let d=a?fmtKurz(a):"ohne Datum";const e=ende(p);
  if(a&&e&&e!==a&&(p.termine||[]).length>1&&/tag|bis|ende/i.test((p.termine[p.termine.length-1]||{}).zusatz||""))d+=" – "+fmtKurz(e);
  return[d,z.split(/\s*[–-]\s*/)[0],o,feld(p,"Form")].filter(Boolean).join(" · ");
}
function hayP(p){return norm([p.titel,p.untertitel,p.kurz,p.lang,(p.orte||[]).map(o=>o.wert).join(" "),(p.mitwirkende||[]).map(m=>m.name+" "+m.rolle+" "+m.bio).join(" "),(p.felder||[]).map(f=>f.v).join(" "),fmtLang(auftakt(p))].join(" "))}

    if(ui.kanalAnsicht==="kanaele"){

function karteiP(p){
  const kern=[
    ["Datum","termine","Datum",(x,i)=>`${datumFeld(x,i)}<input class="ed z" data-bind="p:termine.${i}.zusatz" value="${esc(x.zusatz)}" placeholder="${i===0?"Auftakt":"Zusatz"}" aria-label="Zusatz zu Datum ${i+1}">`],

function datumFeld(x,i){
  const lbl=`Datum ${i+1}${i===0?" (Auftakt)":""}`;
  if(ui.dEdit===i)return `<input class="ed v ${i===0?"haupt":""} dein" id="d-in-${i}" data-dinput="${i}" value="${esc(x.datum?fmtCH(x.datum):"")}" placeholder="TT.MM.JJJJ" inputmode="numeric" autocomplete="off" aria-label="${lbl}, Format TT.MM.JJJJ" aria-describedby="d-hint">`
    +`<span id="d-hint" class="sr">Enter übernimmt, Esc bricht ab</span>`;
  return `<button type="button" class="ed v dbtn ${i===0?"haupt":""} ${x.datum?"":"leer"}" data-act="d-edit" data-arg="${i}" aria-label="${lbl}: ${esc(x.datum?fmtLang(x.datum):"leer")}, bearbeiten">${x.datum?esc(fmtLang(x.datum)):"Datum"}</button>`;
}
const fmtCH=iso=>{const d=parse(iso);return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()};
/* «22.10.2026», «22.10.26», «22.10.» (laufendes Jahr), «2026-10-22» → ISO; "" → ""; ungültig → null */
function parseCH(s){
  s=String(s||"").trim();if(!s)return"";
  let y,m,d,r;
  if((r=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))[y,m,d]=[+r[1],+r[2],+r[3]];
  else if((r=s.match(/^(\d{1,2})[.\/ ](\d{1,2})[.\/ ]?(\d{2}|\d{4})?\.?$/))){d=+r[1];m=+r[2];y=r[3]?+r[3]:new Date().getFullYear();if(y<100)y+=2000}
  else return null;
  const dt=new Date(y,m-1,d);
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?isoOf(dt):null;
}
function datumUebernehmen(el){
  const i=+el.dataset.dinput,p=get("projekte",ui.projekt);if(!p||!p.termine[i])return true;
  const v=parseCH(el.value);
  if(v===null){el.classList.add("ungueltig");toast("Datum nicht erkannt – Format TT.MM.JJJJ");return false}

}

/* Alles rund um den Übergang von v1 in einem einklappbaren Block (Notiz 18.10.) */
function uebergangTeil(){
  if(syncCfg)return""; // Übergang abgeschlossen (Leowie 18.10.): mit Sync kein v1-Block mehr
  const ohneSync=!syncCfg&&(istTestdaten()||!live("projekte").length);
  if(ohneSync)return `<div><p class="sek" style="padding-bottom:8px">Daten aus v1 übernehmen</p>${migTeil()}</div>`;
  const teile=[["Vorlagen anlegen",vorschlagTeil()],["Fachgruppen",fgTeil()],["Massnahmen aufräumen",aufrTeil()],["Projektfelder korrigieren",feldTeil()]];
  const offen=teile.filter(x=>x[1]).map(x=>x[0]);

/* ================= Sync: GitHub-Contents-API (Muster Feld / alte Webapp, P-008) =================
   data-v2.json im Repo kommunikation-data; Merge pro Record (jüngeres modified gewinnt, Tombstones
   wandern mit), PUT mit Retry bei SHA-Konflikt, Polling + visibilitychange, offline-first.
   Die alte data.json (schemaVersion 1) wird nie geschrieben (Sperre in ghPut). */
const KEY_SYNC="komm-v2-sync",KEY_SYNC_OK="komm-v2-sync-erstmals";
const SYNC_COLL=["traeger","projekte","kanaele","presets","status","vorlagen","notizen"];
const POLL_MS=60000,SYNC_DEBOUNCE_MS=1500,V1_DATEI=/(^|\/)data\.json$/i;
let syncCfg=null,syncInFlight=false,syncNochmal=false,syncPoll=null,syncDeb=null,syncState="off",syncHint="",syncLast=null,syncRenderPending=false;
function syncCfgLaden(){try{syncCfg=JSON.parse(localStorage.getItem(KEY_SYNC)||"null")}catch(e){syncCfg=null}}
function syncCfgSpeichern(){try{if(syncCfg)localStorage.setItem(KEY_SYNC,JSON.stringify(syncCfg));else localStorage.removeItem(KEY_SYNC)}catch(e){}}
function utf8ToBase64(str){const b=new TextEncoder().encode(str);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function base64ToUtf8(b64){const bin=atob(String(b64).replace(/\s/g,""));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
const ghUrl=(c,path)=>`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`;
const ghHead=c=>({Authorization:`Bearer ${c.token}`,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"});
async function ghFehler(r,op){const e=new Error(`${op} ${r.status}: ${(await r.text()).slice(0,200)}`);e.status=r.status;return e}
async function ghGet(c,path){
  const r=await fetch(ghUrl(c,path),{headers:ghHead(c),cache:"no-store"});
  if(r.status===404)return{data:null,sha:null};
  if(!r.ok)throw await ghFehler(r,"GET");
  const j=await r.json();let txt;
  if(j.content&&j.encoding==="base64")txt=base64ToUtf8(j.content);
  else{const r2=await fetch(ghUrl(c,path),{headers:Object.assign(ghHead(c),{Accept:"application/vnd.github.raw+json"}),cache:"no-store"});if(!r2.ok)throw await ghFehler(r2,"GET");txt=await r2.text()} // Dateien > 1 MB
  try{return{data:JSON.parse(txt),sha:j.sha}}catch(e){throw new Error(path+" ist kein gültiges JSON")}
}
async function ghPut(c,path,data,sha){
  if(V1_DATEI.test(path))throw new Error("data.json (v1) wird nie geschrieben");
  const body={message:`Sync ${nowISO()}`,content:utf8ToBase64(JSON.stringify(data,null,1))};if(sha)body.sha=sha;
  const r=await fetch(ghUrl(c,path),{method:"PUT",headers:Object.assign(ghHead(c),{"Content-Type":"application/json"}),body:JSON.stringify(body)});
  if(!r.ok)throw await ghFehler(r,"PUT");
  return(await r.json()).content.sha;
}
function mergeArr(lokal,remote){
  const m=new Map();for(const r of remote||[])if(r&&r.id!=null)m.set(r.id,r);
  for(const l of lokal||[]){const x=m.get(l.id);if(!x||(l.modified||"")>=(x.modified||""))m.set(l.id,l)}
  return[...m.values()];
}
const sigVon=r=>(r.modified||"")+(r.deleted?"|D":"");
function gleich(a,b){return SYNC_COLL.every(k=>{const A=new Map((a[k]||[]).map(r=>[r.id,sigVon(r)])),B=b[k]||[];return A.size===B.length&&B.every(r=>A.get(r.id)===sigVon(r))})}
function payloadAus(remote){const p={schemaVersion:2,modified:nowISO(),herkunft:(remote&&remote.herkunft)||DB.herkunft||""};
  if(remote)for(const k of Object.keys(remote))if(Array.isArray(remote[k])&&!SYNC_COLL.includes(k))p[k]=remote[k]; // unbekannte Collections einer neueren Version mitführen
  for(const k of SYNC_COLL)p[k]=mergeArr(DB[k],remote?remote[k]:[]);return p}
/* Ergebnis mit dem AKTUELLEN lokalen Stand mergen – Änderungen während des Syncs gehen nicht verloren */
function syncUebernehmen(p){
  const fin={};for(const k of SYNC_COLL)fin[k]=mergeArr(DB[k],p[k]);
  const anders=!gleich(DB,fin);
  for(const k of SYNC_COLL)DB[k]=fin[k];
  if(!DB.herkunft&&p.herkunft)DB.herkunft=p.herkunft;
  saveNow();
  if(!gleich(fin,p))syncNochmal=true;
  if(anders)renderNachSync();
}
function renderNachSync(){
  const a=document.activeElement;
  if(a&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)&&a.closest("#main,#side")){syncRenderPending=true;return} // nicht beim Tippen neu zeichnen
  render();if($("#einst").open)renderEinst();
}
function syncFehlerText(e){
  if(e.status===401)return"Token ungültig oder abgelaufen – in den Einstellungen erneuern.";
  if(e.status===403)return"Zugriff verweigert – Token-Berechtigung prüfen (Contents: Read and write).";
  if(e.status===404)return"Repo nicht gefunden – Benutzername und Repository prüfen.";
  if(e instanceof TypeError)return"Keine Verbindung – Änderungen bleiben lokal und werden später synchronisiert.";
  return e.message;
}
function syncStatus(s,hint){
  syncState=s;
  syncHint=hint||{off:"Sync nicht eingerichtet – Einstellungen öffnen",syncing:"Synchronisiert …",synced:"Synchronisiert – klicken für manuellen Sync",error:"Sync-Fehler – klicken für erneuten Versuch"}[s];
  const d=$("#syncdot");if(d){d.querySelector(".dot").className="dot "+s;d.title=syncHint;d.setAttribute("aria-label","Sync: "+syncHint)}
  const st=$("#sync-st");if(st){st.textContent=syncZeile();st.className="k"+(s==="error"?" fehler":"")}
}
function syncZeile(){
  if(syncState==="error")return syncHint;
  if(syncState==="syncing")return"Synchronisiert …";
  if(!syncCfg)return"";
  return syncLast?`Synchronisiert um ${new Date(syncLast).toLocaleTimeString("de-CH",{hour:"2-digit",minute:"2-digit"})}.`:"Verbunden.";
}
async function syncNow(){
  if(!syncCfg)return;
  if(syncInFlight){syncNochmal=true;return}
  syncInFlight=true;syncStatus("syncing");
  try{
    for(let v=1;v<=3;v++){
      const{data:raw,sha}=await ghGet(syncCfg,syncCfg.path);
      if(raw&&raw.schemaVersion!==2)throw new Error(`${syncCfg.path} hat schemaVersion ${raw.schemaVersion}, erwartet 2 – Sync angehalten.`);
      const p=payloadAus(raw);
      if(raw&&gleich(p,raw)){syncUebernehmen(p);break}
      try{await ghPut(syncCfg,syncCfg.path,p,sha);syncUebernehmen(p);try{localStorage.setItem(KEY_SYNC_OK,"1")}catch(e){}break}
      catch(e){if((e.status===409||e.status===422)&&v<3)continue;throw e}
    }
    syncLast=nowISO();syncStatus("synced");
  }catch(e){console.error("Sync-Fehler",e);syncStatus("error",syncFehlerText(e))}
  finally{syncInFlight=false;if(syncNochmal){syncNochmal=false;setTimeout(syncNow,500)}}
}
function scheduleSync(){if(!syncCfg)return;if(syncInFlight){syncNochmal=true;return}clearTimeout(syncDeb);syncDeb=setTimeout(syncNow,SYNC_DEBOUNCE_MS)}
function syncPollStart(){clearInterval(syncPoll);syncPoll=syncCfg?setInterval(syncNow,POLL_MS):null}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&syncCfg)syncNow()});
window.addEventListener("online",()=>{if(syncCfg)syncNow()});
/* Testdaten dürfen nie ins Repo (D-015) */
const istTestdaten=()=>DB.herkunft==="testdaten"||(!DB.herkunft&&JSON.stringify(DB.kanaele||[]).includes("@example.ch"));
const leererBestand=herkunft=>({schemaVersion:2,erstellt:nowISO(),herkunft:herkunft||"",traeger:[],projekte:[],kanaele:[],presets:[],status:[],vorlagen:[],notizen:[]});
async function syncVerbinden(){
  const f=ui.sf,st=x=>{ui.sfMeldung=x;renderEinst()};
  const cfg={owner:f.owner.trim(),repo:f.repo.trim(),path:(f.path.trim()||"data-v2.json").replace(/^\/+/,""),token:f.token.trim()};
  if(!cfg.owner||!cfg.repo||!cfg.token)return st("Benutzername, Repository und Token sind nötig.");
  if(V1_DATEI.test(cfg.path))return st("data.json ist die Datei der alten App und wird nie geschrieben. Bitte data-v2.json verwenden.");

    if(!r.data)return st("Lokal sind nur Testdaten, und "+cfg.path+" gibt es im Repo noch nicht. Zuerst «Daten aus v1 übernehmen».");
    if(r.data.schemaVersion!==2)return st(cfg.path+" hat nicht schemaVersion 2.");
    DB=leererBestand(r.data.herkunft);saveNow();ui.projekt=ui.kanal=ui.preset=null;navHist=[];navPos=-1; // Testdaten verwerfen, Repo-Stand holen
  }else if(!localStorage.getItem(KEY_SYNC_OK)&&ui.syncSchritt!=="ok"){ui.syncSchritt="backup";ui.sfMeldung="";return renderEinst()}

function syncTrennen(){syncCfg=null;syncCfgSpeichern();clearInterval(syncPoll);syncPoll=null;syncLast=null;syncStatus("off");ui.sfMeldung="Getrennt. Die Daten bleiben lokal erhalten.";renderEinst()}

/* ================= v1-Stufen aufräumen (Entscheid Leowie 18.10.2026, P-013) =================
   «anstehend»/«am Horizont» entfallen, wo der Kanal genau eine andere Massnahme hat (= «spätestens bis»);
   Status und Presets werden auf diese umgehängt. «spätestens bis» wird nach Kanal-Typ benannt. */
const FRUEH=/^(anstehend|am horizont|horizont)$/i,SPAET=/^spätestens( bis)?$/i;
const TYPNAME2={"Agenda & Newsletter":"Eingabe","Persönliche Einladung":"Einladung","Soziale Netzwerke":"Post","Vor Ort":"Aushang","Website":"Eintrag","Medien":"Medienmitteilung"};
function aufrPlan(){
  const P=[];
  for(const k of live("kanaele")){
    const ms=k.massnahmen||[],frueh=ms.filter(m=>FRUEH.test(m.name)),rest=ms.filter(m=>!FRUEH.test(m.name));
    let weg=[],ziel=null;
    if(ms.length>=2&&frueh.length){
      if(rest.length===1&&SPAET.test(rest[0].name)){weg=frueh;ziel=rest[0]}
      else P.push({k,typ:"selbst",text:`${k.name}: ${ms.map(m=>`«${m.name}» (${m.vorlauf_tage??"läuft"} T)`).join(", ")} – keine eindeutige «spätestens bis»`});
    }
    const neu=TYPNAME2[k.typ],bleibt=ms.filter(m=>!weg.includes(m));
    const um=bleibt.filter(m=>SPAET.test(m.name)&&neu&&!bleibt.some(x=>x!==m&&norm(x.name)===norm(neu)));
    if(weg.length||um.length){
      const n=live("status").filter(s=>s.kanal_id===k.id&&weg.some(m=>m.id===s.massnahme_id)).length;
      P.push({k,typ:"aendern",weg,ziel,um:um.length===1?um:[],neu,
        text:[...weg.map(m=>`«${m.name}» (${m.vorlauf_tage??"läuft"} T) entfernen`),...(um.length===1?[`«${um[0].name}» → «${neu}»`]:[])].join(" · ")+(n?` · ${n} Projekt-Einträge umgehängt`:"")});
    }
  }
  return P;
}
function aufrAusfuehren(){
  const P=aufrPlan().filter(x=>x.typ==="aendern");let n=0;
  for(const x of P){
    const k=x.k,wegIds=x.weg.map(m=>m.id);
    if(x.ziel){
      for(const st of live("status").filter(s=>s.kanal_id===k.id&&wegIds.includes(s.massnahme_id))){
        const da=live("status").find(s=>s.projekt_id===st.projekt_id&&s.kanal_id===k.id&&s.massnahme_id===x.ziel.id);
        if(!da){st.massnahme_id=x.ziel.id;touch(st)}
        else tomb(st); // «spätestens bis» hat Vorrang
      }
      for(const pr of live("presets")){const alt=pr.kanal_massnahmen,neu=[...new Set(alt.map(key=>wegIds.some(id=>key===k.id+":"+id)?k.id+":"+x.ziel.id:key))];
        if(neu.length!==alt.length||neu.some((v,i)=>v!==alt[i])){pr.kanal_massnahmen=neu;touch(pr)}}
      k.massnahmen=k.massnahmen.filter(m=>!wegIds.includes(m.id));
    }

async function copy(t){
  if(!t){toast("leer – nichts kopiert");return}
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(x){}a.remove()}
  toast("kopiert");
}
function copyText(spec){
  const[t,a,b]=spec.split("|"),p=get("projekte",ui.projekt);if(!p)return"";
  switch(t){
    case"kern":return kernText(p,a);
    case"feld":return((p.felder||[])[+a]||{}).v||"";
    case"kurz":return p.kurz||"";case"lang":return p.lang||"";
    case"bios":return biosText(p);
    case"bio":{const m=(p.mitwirkende||[])[+a];return m&&m.bio?`${m.name} – ${m.bio}`:""}
    case"alle":return alleInfos(p);
    case"ff":{const r=rowOf(p,a);return r?(formFelder(p,r)[+b]||{}).wert||"":""}
    case"vt":{const r=rowOf(p,a);return r?versand(p,r).text:""}
    case"vb":{const r=rowOf(p,a);return r?emails(r.k).join(", "):""}
  }
  return"";
}
function setStatus(p,key,s){
  const st=ensureStatus(p,key),r=rowOf(p,key);
  if(s==="erledigt"){
    st.erledigt_am=today();
    const v=versand(p,r);
    st.versand={an:emails(r.k).join(", "),betreff:v.betreff,text:r.m.form==="formular"?formFelder(p,r).map(f=>`${f.label}: ${f.wert}`).join("\n"):v.text,anhaenge:v.anhaenge};
  }else st.erledigt_am=null;

}

function parseKontakte(txt){
  const out=[];for(let z of txt.split(/\r?\n/)){z=z.trim();if(!z)continue;
    const m=z.match(/[^\s<>,;"']+@[^\s<>,;"']+\.[a-z]{2,}/i);const email=m?m[0]:"";
    const name=(email?z.replace(email,""):z).replace(/[<>"';,\t]+/g," ").replace(/\s+/g," ").trim();
    if(norm(name)==="name"&&/mail/i.test(z))continue; // Kopfzeile einer CSV
    out.push({name,email,notiz:""})}
  return out;
}

let pending=false,pointerDown=false;
function flush(){if(!pending)return;pending=false;if($("#einst").open)return;render()}
document.addEventListener("pointerdown",()=>{pointerDown=true},true);
document.addEventListener("pointerup",()=>{pointerDown=false;if(pending)setTimeout(flush,0)},true);
document.addEventListener("focusout",e=>{
  if(syncRenderPending&&e.target.closest&&e.target.closest("#main,#side")){syncRenderPending=false;pending=true;if(!pointerDown)setTimeout(flush,0)}
  const di=e.target.dataset&&e.target.dataset.dinput;
  if(di!=null){if(ui.dEdit!==+di)return;if(!datumUebernehmen(e.target))toast("Datum nicht übernommen – Format TT.MM.JJJJ");ui.dEdit=null;pending=true;if(!pointerDown)setTimeout(flush,0);return}
  if(!dirty||e.target.dataset.rerender==null)return;dirty=false;pending=true;
  if(!pointerDown)setTimeout(flush,0);
});
function bindSet(spec,val,el){
  const parts=spec.split(":"),scope=parts[0];let rec,obj,path;
  if(scope==="p"){rec=obj=get("projekte",ui.projekt);path=parts[1]}
  else if(scope==="k"){rec=obj=get("kanaele",ui.kanal);path=parts[1]}
  else if(scope==="pr"){rec=obj=get("presets",ui.preset);path=parts[1]}
  else if(scope==="v"){rec=obj=get("vorlagen",ui.vorlage);path=parts[1]}
  else if(scope==="t"){rec=obj=get("traeger",parts[1]);path=parts[2]}
  else if(scope==="km"){rec=get("kanaele",ui.kanal);obj=rec&&rec.massnahmen.find(m=>m.id===parts[1]);path=parts[2]}
  else if(scope==="st"){const p=get("projekte",ui.projekt);path=parts.pop();const key=parts.slice(1).join(":");rec=obj=ensureStatus(p,key)}
  if(!obj||!path)return;
  if(/vorlauf_tage$|\.limit$/.test(path))val=val===""?null:Math.max(0,parseInt(val,10)||0);
  setPath(obj,path,val);touch(rec);
}

document.addEventListener("keydown",e=>{
  const tag=document.activeElement.tagName;
  if(ui.notiz.offen&&e.target.closest&&e.target.closest("#notizpanel")){
    if(e.key==="Escape"){e.preventDefault();ui.notiz.offen=false;renderNotizPanel();$("#nzbtn").focus();return}
    if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();nzSpeichern();$("#nzbtn").focus();return}
  }
  if(e.target.id==="addq"){
    const n=document.querySelectorAll("#am-l .am-o").length;
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!n)return;ui.addSel=(ui.addSel+(e.key==="ArrowDown"?1:-1)+n)%n;addListeNeu();return}
    if(e.key==="Enter"){e.preventDefault();const o=$("#am-o-"+ui.addSel);if(o)addMassnahme(o.dataset.akey);return}
    if(e.key==="Escape"){e.preventDefault();ui.addMass=false;render('[data-act="add-mass"]');return}
  }
  const di=e.target.dataset&&e.target.dataset.dinput;
  if(di!=null&&(e.key==="Enter"||e.key==="Escape")){
    e.preventDefault();
    if(e.key==="Enter"&&!datumUebernehmen(e.target))return;
    ui.dEdit=null;render(`[data-act="d-edit"][data-arg="${di}"]`);return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="f"){e.preventDefault();$("#q").focus();$("#q").select();return}
  /* ⌘[ / ⌘] (Strg+[ / Strg+]) und Alt+←/→ ausserhalb von Eingabefeldern: Verlauf */
  const tippt=["INPUT","TEXTAREA","SELECT"].includes(tag);
  if(!$("#einst").open&&(((e.metaKey||e.ctrlKey)&&(e.key==="["||e.key==="]"))||(e.altKey&&!tippt&&(e.key==="ArrowLeft"||e.key==="ArrowRight")))){
    e.preventDefault();if(document.activeElement&&tippt)document.activeElement.blur();navGo(e.key==="["||e.key==="ArrowLeft"?-1:1);return}
  if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(tag)){e.preventDefault();$("#q").focus();return}
  if(e.key==="Escape"){
    if($("#einst").open||$("#notizen").open)return;
    if(ui.notiz.offen){ui.notiz.offen=false;renderNotizPanel();return}
    if(ui.menu){ui.menu=false;render('[data-act="menu"]');return}
    if(document.activeElement.id==="q"&&ui.q){ui.q="";$("#q").value="";renderSide();return}
    if(ui.auf&&!["INPUT","TEXTAREA"].includes(tag)){const k=ui.auf;ui.auf=null;render(`[data-act="auf"][data-arg="${CSS.escape(k)}"]`)}
  }
});
